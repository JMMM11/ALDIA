<!doctype html>
<html lang="es-PA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ALDÍA: tu comunidad, informada a tiempo</title>
    <meta
      name="description"
      content="Alertas comunitarias para Villa del Campo, Valle Dorado, Nicolás Solano y Martín Sánchez (La Chorrera). Crecidas, cortes de agua, vías cerradas y traslados, confirmados por los vecinos."
    />
    <meta name="theme-color" content="#0c111b" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Aplica el tema antes de pintar para evitar el destello de color.
      (function () {
        var guardado = null;
        try { guardado = localStorage.getItem('aldia-tema'); } catch (e) {}
        var oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = guardado || (oscuro ? 'dark' : 'light');
      })();
    </script>
    <!-- Fuentes (licencia OFL), solo el subconjunto latino: cubre todo el español.
         Se precargan para que la vista previa del hero ya se vea con ellas. -->
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fuentes/plus-jakarta-sans-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fuentes/inter-latin-wght-normal.woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('%BASE_URL%fuentes/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('%BASE_URL%fuentes/inter-latin-wght-normal.woff2') format('woff2-variations');
      }
    </style>
    <style>
      /* Vista previa estática del hero: se pinta antes de que cargue JavaScript
         (mejora FCP y LCP). Copia las medidas de src/components/inicio/Hero.module.css;
         si cambias el hero, ajusta también esto. Al arrancar, el hero de React se
         dibuja encima y reutiliza esta misma foto como primera diapositiva. */
      body { margin: 0; -webkit-font-smoothing: antialiased; }
      .hero-previo { position: absolute; top: 0; left: 0; right: 0; display: grid; align-items: end; overflow: hidden; min-height: calc(100svh - 68px); background: #0c111b; color: #fff; }
      .hero-previo picture { position: absolute; inset: 0; }
      .hero-previo img { width: 100%; height: 100%; object-fit: cover; }
      .hero-previo::after {
        content: ''; position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgb(8 12 20 / 0.6) 0%, rgb(8 12 20 / 0.1) 30%, rgb(8 12 20 / 0.55) 62%, rgb(8 12 20 / 0.92) 100%),
          linear-gradient(90deg, rgb(8 12 20 / 0.45) 0%, transparent 60%);
      }
      .hp-contenido {
        position: relative; z-index: 1; display: grid;
        width: min(100% - 2 * clamp(1rem, 4vw, 2rem), 1200px); margin-inline: auto;
        padding: 100px 0 clamp(1.5rem, 5vh, 3.5rem);
      }
      .hp-texto { display: grid; gap: 1rem; justify-items: start; }
      .hp-titulo {
        margin: 0; max-width: 16ch; letter-spacing: -0.03em; text-wrap: balance;
        font: 700 clamp(2.25rem, 1.4rem + 3.6vw, 4.25rem) / 1.04 'Plus Jakarta Sans Variable', ui-sans-serif, system-ui, sans-serif;
      }
      .hp-mensaje {
        --t: clamp(1.0625rem, 1rem + 0.3vw, 1.1875rem);
        margin: 0; max-width: 44ch; min-height: calc(var(--t) * 1.55 * 3); color: rgb(255 255 255 / 0.9);
        font: 400 var(--t) / 1.55 'Inter Variable', ui-sans-serif, system-ui, sans-serif; text-wrap: pretty;
      }
      .hp-ctas { height: 48px; }
      .hp-controles { height: 44px; }
      /* Con React montado solo queda la foto: el velo y el texto los pone el hero real. */
      .hero-previo.montado::after, .hero-previo.montado .hp-contenido { display: none; }
      @media (min-width: 700px) { .hp-mensaje { min-height: calc(var(--t) * 1.55 * 2); } }
      @media (min-width: 960px) { .hp-contenido { grid-template-columns: minmax(0, 1.3fr) minmax(300px, 0.7fr); gap: 2rem; } }
      @media (min-width: 1024px) { .hero-previo { min-height: min(100svh, 920px); } }
    </style>
  </head>
  <body>
    <div class="hero-previo" id="hero-previo" aria-hidden="true">
      <picture>
        <source media="(max-width: 700px)" srcset="%BASE_URL%fotos/lluvia-noche-m.webp" width="800" height="1100" />
        <img src="%BASE_URL%fotos/lluvia-noche-l.webp" width="1600" height="1000" alt="" fetchpriority="high" />
      </picture>
      <div class="hp-contenido">
        <div class="hp-texto">
          <p class="hp-titulo">Tu comunidad, informada a tiempo.</p>
          <p class="hp-mensaje">Cuando llueve fuerte, tus vecinos te avisan si el Caimito o el Martín Sánchez empiezan a crecer.</p>
          <div class="hp-ctas"></div>
          <div class="hp-controles"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // La vista previa solo corresponde a la portada.
      if (location.pathname !== '%BASE_URL%' && location.pathname + '/' !== '%BASE_URL%') {
        document.getElementById('hero-previo').remove();
      }
    </script>
    <noscript>ALDÍA necesita JavaScript activado para mostrar las alertas.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
