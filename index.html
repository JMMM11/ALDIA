<!doctype html>
<html lang="es-PA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ALDÍA: tu comunidad, informada a tiempo</title>
    <meta
      name="description"
      content="Alertas comunitarias para Villa del Campo, Valle Dorado, Nicolás Solano y Martín Sánchez (La Chorrera). Crecidas, cortes de agua, vías cerradas y traslados, confirmados por los vecinos."
    />
    <meta name="theme-color" content="#eef2f7" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Fuentes (licencia OFL), solo el subconjunto latino: cubre todo el español.
         Se precargan para que la vista previa del hero ya se vea con ellas. -->
    <link rel="preload" as="font" type="font/woff2" href="./fuentes/plus-jakarta-sans-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fuentes/inter-latin-wght-normal.woff2" crossorigin />
    <style>@font-face{font-family:Plus Jakarta Sans Variable;font-style:normal;font-display:swap;font-weight:200 800;src:url(./fuentes/plus-jakarta-sans-latin-wght-normal.woff2)format("woff2-variations")}@font-face{font-family:Inter Variable;font-style:normal;font-display:swap;font-weight:100 900;src:url(./fuentes/inter-latin-wght-normal.woff2)format("woff2-variations")}</style>
    <style>body{-webkit-font-smoothing:antialiased;margin:0}.hero-previo{color:#fff;background:#0c111b;align-items:end;min-height:calc(100svh - 68px);display:grid;position:absolute;top:0;left:0;right:0;overflow:hidden}.hero-previo picture{position:absolute;inset:0}.hero-previo img{object-fit:cover;width:100%;height:100%}.hero-previo:after{content:"";background:linear-gradient(#080c1499 0%,#080c141a 30%,#080c148c 62%,#080c14eb 100%),linear-gradient(90deg,#080c1473 0%,#0000 60%);position:absolute;inset:0}.hp-contenido{z-index:1;width:min(100% - 2*clamp(1rem,4vw,2rem),1200px);margin-inline:auto;padding:100px 0 clamp(1.5rem,5vh,3.5rem);display:grid;position:relative}.hp-texto{justify-items:start;gap:1rem;display:grid}.hp-titulo{letter-spacing:-.03em;text-wrap:balance;max-width:16ch;margin:0;font:700 clamp(2.25rem,1.4rem + 3.6vw,4.25rem)/1.04 Plus Jakarta Sans Variable,ui-sans-serif,system-ui,sans-serif}.hp-mensaje{--t:clamp(1.0625rem, 1rem + .3vw, 1.1875rem);max-width:44ch;min-height:calc(var(--t) * 1.55 * 3);color:#ffffffe6;font:400 var(--t) / 1.55 "Inter Variable", ui-sans-serif, system-ui, sans-serif;text-wrap:pretty;margin:0}.hp-ctas{height:48px}.hp-controles{height:44px}.hero-previo.montado:after,.hero-previo.montado .hp-contenido{display:none}@media (width>=700px){.hp-mensaje{min-height:calc(var(--t) * 1.55 * 2)}}@media (width>=960px){.hp-contenido{grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:2rem}}@media (width>=1024px){.hero-previo{min-height:min(100svh,920px)}}</style>
    <script type="module" crossorigin src="./assets/index-D4scY5St.js"></script>
  </head>
  <body>
    <div class="hero-previo" id="hero-previo" aria-hidden="true">
      <picture>
        <source media="(max-width: 700px)" srcset="./fotos/lluvia-noche-m.webp" width="800" height="1100" />
        <img src="./fotos/lluvia-noche-l.webp" width="1600" height="1000" alt="" fetchpriority="high" />
      </picture>
      <div class="hp-contenido">
        <div class="hp-texto">
          <p class="hp-titulo">Tu comunidad, informada a tiempo.</p>
          <p class="hp-mensaje">Cuando llueve fuerte, tus vecinos te avisan si el Caimito o el Martín Sánchez empiezan a crecer.</p>
          <div class="hp-ctas"></div>
          <div class="hp-controles"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // La vista previa solo corresponde a la portada (las rutas van después del #).
      if (location.hash.replace(/^#\/?/, '') !== '') {
        document.getElementById('hero-previo').remove();
      }
    </script>
    <noscript>ALDÍA necesita JavaScript activado para mostrar las alertas.</noscript>
  </body>
</html>
